name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch cancels the previous run — no point finishing
# a build for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest

    services:
      # The suites talk to a real MongoDB rather than a mock: several of the
      # behaviours under test (unique-index collisions on concurrent contest
      # submits, TTL indexes, atomic findOneAndUpdate claims) only exist in
      # the database, so mocking them would test nothing.
      mongo:
        image: mongo:7
        ports: ['27055:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: "Prompt Kaizen Backend"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: "Prompt Kaizen Backend/package-lock.json"

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        # Fails the build on a high-severity advisory in anything that ships.
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax check
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Start API
        env:
          PORT: 5099
          MONGO_URI: mongodb://127.0.0.1:27055/pk_ci
          # Generated per run; never a fixed value, even in CI.
          JWT_SECRET: ${{ github.run_id }}-ci-secret-long-enough-to-pass-validation
          NODE_ENV: development
          # The lockout suite assumes this threshold.
          MAX_FAILED_LOGINS: 3
          # The suites make far more auth calls per minute than a human would.
          RATE_LIMIT_AUTH_PER_MIN: 2000
          RATE_LIMIT_GENERAL_PER_MIN: 5000
          RATE_LIMIT_EMAIL_PER_15MIN: 500
          # Deliberately no EMAIL_* — mail-resilience.test.js asserts the
          # unconfigured-transport behaviour.
        run: |
          node server.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5099/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5099/api/health || { echo "API failed to start"; exit 1; }

      - name: Test
        run: npm test

  frontends:
    name: ${{ matrix.app }} — build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ["Prompt Kaizen Frontend", "Prompt Kaizen Admin"]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: "${{ matrix.app }}/package-lock.json"

      - name: Install
        run: npm ci

      - name: Build
        # A build failure here is the only thing standing between a broken
        # import and a white screen in production, since these are SPAs with
        # no server-side rendering to fail loudly.
        run: npm run build

  theme:
    name: Theme — light/dark integrity
    runs-on: ubuntu-latest
    needs: frontends
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build both apps
        run: |
          for app in "Prompt Kaizen Frontend" "Prompt Kaizen Admin"; do
            (cd "$app" && npm ci && npm run build)
          done

      # Guards against the failure mode this theming is most prone to: a class
      # that still resolves to a hardcoded colour, so it silently stops
      # responding to the theme without breaking the build.
      - name: Verify every themed class flips
        run: node scripts/verify-theme.cjs
