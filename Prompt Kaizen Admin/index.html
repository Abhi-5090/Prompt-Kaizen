<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resolve the theme BEFORE first paint.
      //
      // React mounts after the browser has already painted, so setting
      // data-theme from a useEffect shows every dark-mode user a white flash
      // on each page load. This runs synchronously in <head>, ahead of the
      // stylesheet, so the first paint is already correct.
      //
      // Deliberately duplicates the logic in ThemeContext.jsx — the two must
      // agree, and this cannot import from the bundle.
      (function () {
        try {
          var stored = localStorage.getItem('pk_theme');
          var prefersDark = window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#101316' : '#fafafa');
        } catch (e) {
          // Blocked storage or a private window: fall back to light rather
          // than leaving the attribute unset.
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <title>Prompt Kaizen — Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
